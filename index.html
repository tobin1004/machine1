
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 가위바위보 게임</title>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 20px;
        }

        h2 {
            color: #333;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #2878d0;
            color: white;
        }

        button:hover {
            background-color: #145da0;
        }

        #webcam-container {
            margin: 15px;
        }

        #countdown {
            font-size: 45px;
            font-weight: bold;
            color: #e74c3c;
            margin: 20px;
        }

        #result {
            font-size: 24px;
            font-weight: bold;
            margin: 20px;
            color: #2878d0;
        }

        #score {
            font-size: 22px;
            margin: 20px;
        }

        #status {
            color: #555;
        }
    </style>
</head>

<body>

    <h2>AI 가위바위보 게임</h2>

    <button type="button" onclick="init()">게임 시작</button>
    <button type="button" onclick="resetGame()">다시 하기</button>

    <h3>나의 손동작</h3>

    <div id="webcam-container"></div>
    <div id="label-container">웹캠 실행 대기 중</div>

    <div id="countdown"></div>

    <h3>게임 결과</h3>

    <div id="result">게임을 시작하세요!</div>

    <h3>점수 (3판 2선승제)</h3>

    <div id="score">
        나: 0점 / 컴퓨터: 0점
    </div>

    <div id="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<script>

    // Teachable Machine 모델 경로
    const URL = "./model/";

    let model;
    let webcam;
    let maxPredictions;

    let myScore = 0;
    let computerScore = 0;

    let isPlaying = false;
    let isCounting = false;
    let isReady = false;

    let countdownTimer;

    const hands = ["가위", "바위", "보"];

    // 1. 게임 시작
    async function init() {

        if (isReady) {
            resetGame();
            return;
        }

        document.getElementById("status").innerHTML =
            "AI 모델을 불러오는 중입니다.";

        try {

            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);

            maxPredictions = model.getTotalClasses();

            // 웹캠 설정
            const flip = true;

            webcam = new tmImage.Webcam(200, 200, flip);

            await webcam.setup();
            await webcam.play();

            document.getElementById("webcam-container")
                .appendChild(webcam.canvas);

            isReady = true;

            document.getElementById("status").innerHTML =
                "웹캠 준비 완료! 게임을 시작합니다.";

            resetGame();

            window.requestAnimationFrame(loop);

        } catch (error) {

            document.getElementById("status").innerHTML =
                "오류 발생: 카메라 권한과 모델 경로를 확인하세요.";

            console.error(error);
        }
    }

    // 2. 웹캠 반복 실행
    async function loop() {

        if (!isReady) return;

        webcam.update();

        await predict();

        window.requestAnimationFrame(loop);
    }

    // 3. AI 손동작 인식
    async function predict() {

        const prediction = await model.predict(webcam.canvas);

        let bestPrediction = prediction[0];

        for (let i = 1; i < maxPredictions; i++) {

            if (prediction[i].probability >
                bestPrediction.probability) {

                bestPrediction = prediction[i];
            }
        }

        const hand = bestPrediction.className;
        const confidence = bestPrediction.probability;

        document.getElementById("label-container").innerHTML =
            "인식 결과: " + hand +
            " (" + (confidence * 100).toFixed(1) + "%)";

        // 카운트다운이 끝난 후에만 판정
        if (isCounting && confidence >= 0.90 &&
            hands.includes(hand)) {

            isCounting = false;

            clearInterval(countdownTimer);

            playGame(hand);
        }
    }

    // 4. 카운트다운 시작
    function startGame() {

        if (!isReady) {
            document.getElementById("status").innerHTML =
                "먼저 게임 시작 버튼을 눌러주세요.";
            return;
        }

        if (isPlaying) return;

        if (myScore >= 2 || computerScore >= 2) {
            return;
        }

        isPlaying = true;
        isCounting = true;

        let count = 3;

        document.getElementById("result").innerHTML =
            "손동작을 준비하세요!";

        document.getElementById("countdown").innerHTML = count;

        countdownTimer = setInterval(function() {

            count--;

            if (count > 0) {

                document.getElementById("countdown").innerHTML =
                    count;

            } else {

                document.getElementById("countdown").innerHTML =
                    "손동작 인식 중!";

                clearInterval(countdownTimer);

                // 인식 대기 시간 2초
                setTimeout(function() {

                    if (isCounting) {

                        isCounting = false;
                        isPlaying = false;

                        document.getElementById("countdown").innerHTML =
                            "다시 시도하세요.";

                        document.getElementById("result").innerHTML =
                            "손동작을 인식하지 못했습니다.";

                    }

                }, 2000);
            }

        }, 1000);
    }

    // 5. 가위바위보 승패 판정
    function playGame(myHand) {

        // 컴퓨터가 무작위로 선택
        const computerHand =
            hands[Math.floor(Math.random() * 3)];

        let result = "";

        if (myHand === computerHand) {

            result = "무승부!";

        } else if (

            (myHand === "가위" && computerHand === "보") ||
            (myHand === "바위" && computerHand === "가위") ||
            (myHand === "보" && computerHand === "바위")

        ) {

            result = "승리!";
            myScore++;

        } else {

            result = "패배!";
            computerScore++;
        }

        // 결과 출력
        document.getElementById("result").innerHTML =
            "나: " + myHand +
            " / 컴퓨터: " + computerHand +
            "<br><br>" + result;

        // 점수 출력
        document.getElementById("score").innerHTML =
            "나: " + myScore +
            "점 / 컴퓨터: " + computerScore + "점";

        document.getElementById("countdown").innerHTML = "";

        // 3판 2선승제
        if (myScore === 2 || computerScore === 2) {

            isPlaying = true;

            if (myScore === 2) {

                document.getElementById("result").innerHTML +=
                    "<br><br>축하합니다! 최종 승리!";

            } else {

                document.getElementById("result").innerHTML +=
                    "<br><br>컴퓨터 최종 승리!";

            }

            document.getElementById("status").innerHTML =
                "게임 종료! 다시 하기를 눌러주세요.";

        } else {

            isPlaying = false;

            document.getElementById("status").innerHTML =
                "다음 게임을 시작하려면 게임 시작 버튼을 누르세요.";
        }
    }

    // 6. 점수 초기화 및 다시 하기
    function resetGame() {

        myScore = 0;
        computerScore = 0;

        isPlaying = false;
        isCounting = false;

        clearInterval(countdownTimer);

        document.getElementById("score").innerHTML =
            "나: 0점 / 컴퓨터: 0점";

        document.getElementById("result").innerHTML =
            "게임을 시작하세요!";

        document.getElementById("countdown").innerHTML = "";

        document.getElementById("status").innerHTML =
            "게임 준비 완료!";
    }

</script>

</body>
</html>
