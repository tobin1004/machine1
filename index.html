
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 가위바위보 게임</title>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 20px;
        }

        h2 { color: #333; }

        button {
            padding: 12px 25px;
            margin: 10px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background: #2878d0;
            color: white;
            cursor: pointer;
        }

        button:disabled {
            background: gray;
            cursor: not-allowed;
        }

        #countdown {
            font-size: 45px;
            color: red;
            font-weight: bold;
            margin: 20px;
        }

        #result {
            font-size: 24px;
            font-weight: bold;
            color: #2878d0;
            margin: 20px;
        }

        #score {
            font-size: 22px;
            margin: 20px;
        }

        #status {
            color: #555;
            margin: 15px;
        }
    </style>
</head>

<body>

    <h2>AI 가위바위보 게임</h2>

    <button id="startBtn" onclick="startGame()">
        게임 시작
    </button>

    <button onclick="resetGame()">
        점수 초기화
    </button>

    <h3>나의 손동작</h3>

    <div id="webcam-container"></div>
    <div id="label-container">웹캠 실행 전</div>

    <div id="countdown"></div>

    <h3>게임 결과</h3>

    <div id="result">게임을 시작하세요!</div>

    <h3>점수 (3판 2선승제)</h3>

    <div id="score">
        나: 0점 / 컴퓨터: 0점
    </div>

    <div id="status">게임 준비 완료</div>


<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<script>

    // 1. 모델 경로
    const URL = "./model/";

    let model;
    let webcam;

    let isReady = false;
    let isPlaying = false;
    let gameOver = false;

    let myScore = 0;
    let computerScore = 0;

    const hands = ["가위", "바위", "보"];

    const startBtn = document.getElementById("startBtn");


    // 시간 지연 함수
    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }


    // 2. 게임 시작 및 모델 로딩
    async function startGame() {

        if (isPlaying) return;

        // 게임이 끝났다면 점수 초기화
        if (gameOver) {
            resetGame();
        }

        startBtn.disabled = true;

        try {

            if (!isReady) {

                document.getElementById("status").innerHTML =
                    "AI 모델을 불러오는 중입니다.";

                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";

                model = await tmImage.load(
                    modelURL,
                    metadataURL
                );

                // 웹캠 설정
                webcam = new tmImage.Webcam(300, 300, true);

                await webcam.setup();
                await webcam.play();

                document.getElementById("webcam-container")
                    .appendChild(webcam.canvas);

                isReady = true;
            }

            // 한 판 진행
            await playRound();

        } catch (error) {

            console.error(error);

            document.getElementById("status").innerHTML =
                "오류 발생: 모델 경로 또는 카메라 권한을 확인하세요.";

            startBtn.disabled = false;
        }
    }


    // 3. 한 판 진행
    async function playRound() {

        isPlaying = true;

        document.getElementById("status").innerHTML =
            "손동작을 준비하세요!";

        document.getElementById("result").innerHTML =
            "가위, 바위, 보 중 하나를 준비하세요.";

        // 3초 카운트다운
        for (let i = 3; i >= 1; i--) {

            document.getElementById("countdown").innerHTML = i;

            await sleep(1000);
        }

        document.getElementById("countdown").innerHTML =
            "인식 중!";

        document.getElementById("status").innerHTML =
            "AI가 손동작을 분석하고 있습니다.";

        // 여러 프레임을 분석
        const myHand = await recognizeHand();

        document.getElementById("label-container").innerHTML =
            "최종 인식 결과: " + (myHand || "인식 실패");

        if (myHand === null) {

            document.getElementById("result").innerHTML =
                "손동작을 정확하게 인식하지 못했습니다.";

            document.getElementById("status").innerHTML =
                "다시 게임 시작 버튼을 눌러주세요.";

            document.getElementById("countdown").innerHTML = "";

            isPlaying = false;
            startBtn.disabled = false;

            return;
        }

        // 컴퓨터의 손동작 선택
        const computerHand =
            hands[Math.floor(Math.random() * 3)];

        // 승패 판정
        let result = "";

        if (myHand === computerHand) {

            result = "무승부!";

        } else if (

            (myHand === "가위" && computerHand === "보") ||
            (myHand === "바위" && computerHand === "가위") ||
            (myHand === "보" && computerHand === "바위")

        ) {

            result = "승리!";
            myScore++;

        } else {

            result = "패배!";
            computerScore++;
        }

        // 결과 출력
        document.getElementById("result").innerHTML =
            "나: " + myHand +
            "<br>컴퓨터: " + computerHand +
            "<br><br>" + result;

        // 점수 출력
        document.getElementById("score").innerHTML =
            "나: " + myScore +
            "점 / 컴퓨터: " + computerScore + "점";

        document.getElementById("countdown").innerHTML = "";

        // 3판 2선승제
        if (myScore >= 2 || computerScore >= 2) {

            gameOver = true;

            if (myScore >= 2) {

                document.getElementById("result").innerHTML +=
                    "<br><br>🎉 최종 승리!";

            } else {

                document.getElementById("result").innerHTML +=
                    "<br><br>컴퓨터 최종 승리!";

            }

            document.getElementById("status").innerHTML =
                "게임 종료! 다시 시작할 수 있습니다.";

            startBtn.innerHTML = "다시 시작";

        } else {

            document.getElementById("status").innerHTML =
                "다음 판을 진행하려면 버튼을 누르세요.";

            startBtn.innerHTML = "다음 판";
        }

        isPlaying = false;
        startBtn.disabled = false;
    }


    // 4. 손동작 인식 (15회 분석)
    async function recognizeHand() {

        const counts = {
            "가위": 0,
            "바위": 0,
            "보": 0
        };

        let validCount = 0;

        for (let i = 0; i < 15; i++) {

            webcam.update();

            const prediction = await model.predict(webcam.canvas);

            let best = prediction[0];

            for (let j = 1; j < prediction.length; j++) {

                if (prediction[j].probability >
                    best.probability) {

                    best = prediction[j];
                }
            }

            const hand = best.className;
            const confidence = best.probability;

            // 신뢰도 65% 이상인 결과만 사용
            if (confidence >= 0.65 &&
                hands.includes(hand)) {

                counts[hand]++;
                validCount++;
            }

            document.getElementById("label-container").innerHTML =
                "인식 중: " + hand +
                " (" + (confidence * 100).toFixed(1) + "%)";

            await sleep(100);
        }

        // 유효한 인식이 없으면 실패
        if (validCount < 5) {
            return null;
        }

        // 가장 많이 인식된 손동작 선택
        let bestHand = null;
        let maxCount = 0;

        for (const hand of hands) {

            if (counts[hand] > maxCount) {

                maxCount = counts[hand];
                bestHand = hand;
            }
        }

        // 동률인 경우 인식 실패 처리
        const tiedHands = hands.filter(
            hand => counts[hand] === maxCount
        );

        if (tiedHands.length !== 1) {
            return null;
        }

        return bestHand;
    }


    // 5. 점수 초기화
    function resetGame() {

        myScore = 0;
        computerScore = 0;

        gameOver = false;
        isPlaying = false;

        document.getElementById("score").innerHTML =
            "나: 0점 / 컴퓨터: 0점";

        document.getElementById("result").innerHTML =
            "게임을 시작하세요!";

        document.getElementById("countdown").innerHTML = "";

        document.getElementById("status").innerHTML =
            "게임 준비 완료!";

        startBtn.innerHTML = "게임 시작";
        startBtn.disabled = false;
    }

</script>

</body>
</html>
